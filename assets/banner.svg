<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a103c" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .banner-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .banner-subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .card-label {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #38bdf8;
    }
    .card-metric {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 22px;
      fill: #f8fafc;
    }
    .card-sub {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #64748b;
    }

    /* Ambient Pulsing Animations */
    @keyframes pulseGlow {
      0% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
      100% { opacity: 0.35; transform: scale(1); }
    }
    @keyframes floatOrb {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(10px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }

    .pulse-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite, floatOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulse-orb-2 {
      animation: pulseGlow 7s ease-in-out infinite alternate, floatOrb 9s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 3s linear infinite;
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Dynamic Ambient Background Orbs -->
  <g opacity="0.5">
    <circle class="pulse-orb-1" cx="220" cy="120" r="160" fill="#4f46e5" filter="url(#glow)" />
    <circle class="pulse-orb-2" cx="980" cy="280" r="180" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="600" cy="380" r="140" fill="#a855f7" filter="url(#glow)" opacity="0.3" />
  </g>

  <!-- Dynamic Connecting Network Circuit -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 80,360 L 250,360 L 320,310 L 500,310" class="stream-line" />
    <path d="M 700,310 L 880,310 L 940,360 L 1120,360" class="stream-line" />
    <circle cx="80" cy="360" r="4" fill="#38bdf8" />
    <circle cx="320" cy="310" r="4" fill="#818cf8" />
    <circle cx="880" cy="310" r="4" fill="#818cf8" />
    <circle cx="1120" cy="360" r="4" fill="#38bdf8" />
  </g>

  <!-- Decorative Analytics Mini-Cards (Lower Third) -->
  <g transform="translate(140, 290)">
    <rect width="260" height="84" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="28" class="card-label">SaaS ECOSYSTEM</text>
    <text x="20" y="55" class="card-metric">$14.3B+ Market</text>
    <text x="20" y="73" class="card-sub">Zendesk • Freshdesk • Intercom</text>
  </g>

  <g transform="translate(470, 290)">
    <rect width="260" height="84" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="28" class="card-label" fill="#a855f7">SELF-HOSTED FREEDOM</text>
    <text x="20" y="55" class="card-metric">100% Sovereign</text>
    <text x="20" y="73" class="card-sub">Chatwoot • UVdesk • Zammad</text>
  </g>

  <g transform="translate(800, 290)">
    <rect width="260" height="84" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="28" class="card-label" fill="#10b981">RESOLUTION AI</text>
    <text x="20" y="55" class="card-metric">Autonomous Deflection</text>
    <text x="20" y="73" class="card-sub">Fin • Freddy AI • BYOK Models</text>
  </g>

  <!-- TOP FOREGROUND (Always Crystal Clear and Unobscured) -->
  <g transform="translate(600, 65)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="-170" y="0" width="340" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="20" class="badge-text" text-anchor="middle">🚀 THE DEFINITIVE HELPDESK DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="90" class="banner-title" fill="url(#primaryTextGrad)" text-anchor="middle">Awesome Customer Service &amp; Helpdesk</text>

    <!-- Subtitle -->
    <text x="0" y="130" class="banner-subtitle" text-anchor="middle">Top Cloud SaaS Platforms, Omnichannel Inboxes &amp; Open-Source Ticketing Systems</text>

    <!-- Interactive / Feature Tags -->
    <g transform="translate(0, 160)">
      <rect x="-330" y="0" width="150" height="32" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
      <text x="-255" y="20" class="badge-text" text-anchor="middle">⚡ Omnichannel</text>

      <rect x="-165" y="0" width="155" height="32" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
      <text x="-87" y="20" class="badge-text" text-anchor="middle">🤖 AI Ticket Agents</text>

      <rect x="5" y="0" width="165" height="32" rx="16" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
      <text x="87" y="20" class="badge-text" text-anchor="middle">🛡️ Open Source / Self-Hosted</text>

      <rect x="185" y="0" width="145" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="257" y="20" class="badge-text" text-anchor="middle">💰 Transparent Pricing</text>
    </g>
  </g>
</svg>
